; Configuración de la suite Selenium de G09 (aceptación y regresión web).
; Cada valor se puede cambiar con una variable de entorno CONDOR_<CLAVE>
; (por ejemplo CONDOR_URL=http://192.168.1.10:5080/ o CONDOR_HEADLESS=0).

[suite]
; Portal web del mostrador (CC-03) servido por Condor.Api.
url = http://localhost:5080/
; chrome | edge (Selenium Manager ubica o descarga el controlador).
navegador = chrome
; 1 = sin ventana (modo de la regresión); 0 = con ventana (para ver la prueba).
headless = 1
ancho = 1440
alto = 900
; Espera explícita máxima por condición, en segundos.
espera = 10
; Umbrales medibles de la ERS que la suite contrasta.
rnf01_ms = 1000
rnf06_segundos = 60
