" font-size="12" lengthAdjust="spacing" textLength="107.3613" x="37.6709" y="516.3745">DNI, RUC o nombre</text><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="204.7578" x="46.333" y="548.9175"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="184.7578" x="56.333" y="570.1733">Pulsa &#171;Convertir en venta&#187; (Enter)</text><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="245.4219" x="26.001" y="851.9373"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="225.4219" x="36.001" y="873.1931">Elige Boleta o Factura y pulsa Emitir (F10)</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="49.4131" y2="1353.1257"/><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="252.125" x="290.4375" y="236.5078"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="168.7441" x="300.4375" y="257.7637">EmisionComprobante.Preparar:</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="232.125" x="300.4375" y="271.5625">serie PR01, ValidaHasta = emisi&#243;n + 6 d&#237;as</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="231.418" x="300.791" y="304.1055"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="211.418" x="310.791" y="325.3613">Guarda la proforma (no va a la SUNAT)</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="96.6914" x="310.791" y="339.1602">e imprime el ticket</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="184.0918" x="324.4541" y="651.0408"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="s